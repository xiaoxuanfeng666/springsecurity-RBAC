server:
  port: 7070

spring:
  application:
    name: rbac-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rbac?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.rbac.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义 JWT 配置
jwt:
  # 生产环境请替换为随机密钥，长度至少 32 字节（HS256 要求）
  secret: rbac-jwt-secret-key-please-change-in-production-0123456789
  # Access Token 有效期（毫秒）：15 分钟。短有效期由 Refresh Token 兜底，
  # 过期后前端自动调用 /auth/refresh 换取新的 Access Token。
  access-token-expire: 900000
  # Refresh Token 有效期（毫秒）：7 天。也是 Redis 会话的有效期，
  # 停用/离职用户时删除会话即刻失效。
  refresh-token-expire: 604800000
  header: Authorization
  token-prefix: "Bearer "

# OAuth2 客户端密钥的加解密配置
# 客户端密钥（clientdetails.appSecret）需要能在「客户端管理」页面上展示明文供复制给第三方，
# 因此用可逆加密存储：库里是 AES 密文，本服务负责写入时加密、展示时解密。
# 【必须与 rbac-oauth 一致】授权服务器要用同一把密钥解密 appSecret 才能校验客户端身份；
# 两边配置不一致时，客户端会认证失败。
# 【重要】此值一旦变更，库中已有的客户端密钥将无法解密，需要在「客户端管理」页面重新设置密钥。
oauth2:
  client-secret-key: rbac-client-secret-key-please-change-in-production-0123456789
  # 统一门户（5177）与授权服务的对接。门户本身没有用户体系：
  # 它自己也走 rbac-oauth 的授权码模式登录（客户端为 portal），登录后浏览器里就有了
  # 授权服务的会话，再凭这个会话一键把其余子系统的令牌都换出来。
  # client-id / client-secret 必须与「客户端管理」里 portal 客户端的配置一致。
  portal:
    server-url: http://localhost:7071
    client-id: portal
    client-secret: portal123
    # 必须与 clientdetails 里 portal 的 redirectUrl 完全一致，否则换令牌会被拒
    redirect-uri: http://localhost:5177/oauth/callback
    # 门户自己申请的范围
    scope: read
    # 一键登录时替子系统申请的授权范围。子系统客户端都已在 autoApproveScopes 里放行了 read，
    # 因此这一步不会弹出确认页（见 sql/upgrade-2026-10-16-sso.sql）。
    subsystem-scope: read

# RocketMQ：把子系统菜单与用户角色权限下发给对应子系统（消费方订阅 topic RBAC_SUBSYSTEM_SYNC）
# 需要先启动 RocketMQ（NameServer 默认 9876）。broker 未启动时发送失败只记日志，不影响 RBAC 本体。
rocketmq:
  name-server: localhost:9876
  producer:
    group: rbac-backend-producer
    send-message-timeout: 3000

# 子系统数据下发开关。置为 false 可彻底关闭（连定时/启动兜底下发也不做）
rbac:
  subsystem-sync:
    enabled: true

logging:
  level:
    com.example.rbac: debug
    org.springframework.security: info
