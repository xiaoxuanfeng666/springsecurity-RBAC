server:
  port: 7070

spring:
  application:
    name: rbac-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rbac?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.rbac.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# OAuth2 统一登录（rbac-oauth 授权服务）
# 本服务不再自签令牌：登录/刷新走 rbac-oauth，请求鉴权改为本地验签 JWT（公钥来自 /oauth/token_key），
# 令牌有效期由 clientdetails.access_token_validity / refresh_token_validity 决定。
oauth2:
  # 后端到后端调用（换令牌、启动时拉取验签公钥）直连授权服务
  server-url: http://localhost:7071
  # 浏览器跳转授权页用的地址（授权前端，与登录页同源）
  browser-authorize-base-url: http://localhost:5174
  client-id: rbac-admin
  client-secret: rbac123
  # 必须与 clientdetails.redirectUrl 完全一致
  redirect-uri: http://localhost:5173/oauth/callback
  scope: read

  # 客户端密钥的加解密配置
  # 客户端密钥（clientdetails.appSecret）需要能在「客户端管理」页面上展示明文供复制给第三方，
  # 因此用可逆加密存储：库里是 AES 密文，本服务负责写入时加密、展示时解密。
  # 【必须与 rbac-oauth 一致】授权服务器要用同一把密钥解密 appSecret 才能校验客户端身份；
  # 两边配置不一致时，客户端会认证失败。
  # 【重要】此值一旦变更，库中已有的客户端密钥将无法解密，需要在「客户端管理」页面重新设置密钥。
  client-secret-key: rbac-client-secret-key-please-change-in-production-0123456789

# RocketMQ：把子系统菜单与用户角色权限下发给对应子系统（消费方订阅 topic RBAC_SUBSYSTEM_SYNC）
# 需要先启动 RocketMQ（NameServer 默认 9876）。broker 未启动时发送失败只记日志，不影响 RBAC 本体。
rocketmq:
  name-server: localhost:9876
  producer:
    group: rbac-backend-producer
    send-message-timeout: 3000

# 子系统数据下发开关。置为 false 可彻底关闭（连定时/启动兜底下发也不做）
rbac:
  subsystem-sync:
    enabled: true
  # 强制下线 SSO 会话的通知 topic：本服务生产，rbac-oauth 消费
  sso:
    kick-topic: RBAC_OAUTH_SESSION
  # 客户端配置变更的通知 topic：本服务生产，rbac-oauth 消费后删客户端缓存
  client:
    change-topic: RBAC_CLIENT_CHANGE
  # 消费 rbac-oauth 广播的「会话已撤销」：本地验签看不到会话是否存活，
  # 靠这条消息把作废的 sid 写入 Redis（多实例共享，故用默认集群模式消费）
  # 【必须与 rbac-oauth 的 rbac.session.revoke-topic 一致】
  session:
    revoke-topic: RBAC_SESSION_REVOKE
    # 撤销记录兜底保留秒数：仅在消息未带 TTL 时使用。正常由 rbac-oauth 按客户端
    # access_token_validity 计算后随消息下发，令牌有效期改长时不需要改这里
    revoke-ttl-seconds: 43200
  # BFF：浏览器只持一个 HttpOnly 会话 Cookie，OAuth 令牌全部存在本服务 Redis
  bff:
    # 与授权服务共用同一个 Redis，键名必须带前缀避免冲撞
    cookie-name: rbac_bff_session
    # 生产环境走 HTTPS 时置为 true（开发环境是 http，加了浏览器会丢弃 Cookie）
    cookie-secure: false
    # 空闲有效期：会话在这段时间内没有续期就过期
    session-idle-ttl-seconds: 604800
    # 绝对有效期：从登录时刻算起，到点必须重新授权
    session-max-ttl-seconds: 604800

# 外部通讯录 / 部门同步
# 默认关闭；provider=mock + mock-enabled=true 可用于本地联调。
idp:
  directory-sync:
    enabled: ${IDP_DIRECTORY_SYNC_ENABLED:false}
    # 参与拉取对账的来源，多个用逗号分隔：wecom,dingtalk,mock
    providers: ${IDP_DIRECTORY_SYNC_PROVIDERS:mock}
    mock-enabled: ${IDP_DIRECTORY_SYNC_MOCK_ENABLED:false}
    # 推送接口共享密钥；为空时拒绝所有推送
    push-token: ${IDP_DIRECTORY_SYNC_PUSH_TOKEN:}
    cron: ${IDP_DIRECTORY_SYNC_CRON:0 0 3 * * ?}
    root-dept-id: ${IDP_DIRECTORY_SYNC_ROOT_DEPT_ID:1}
    create-users: ${IDP_DIRECTORY_SYNC_CREATE_USERS:true}
    default-role-keys: ${IDP_DIRECTORY_SYNC_ROLE_KEYS:common}
    username-prefix: ${IDP_DIRECTORY_SYNC_USERNAME_PREFIX:idp_}
    corp-id: ${IDP_DIRECTORY_SYNC_CORP_ID:mock-corp}
    dingtalk-corp-id: ${IDP_DIRECTORY_SYNC_DINGTALK_CORP_ID:ding-corp}
    # 企业微信通讯录（providers 含 wecom 时使用）
    wecom-corp-id: ${WECOM_CORP_ID:wwf3f175aaf3dcd969}
    wecom-secret: ${WECOM_SECRET:zbGgZmhrreKu_ZtPQCkidiVaaJdTwuyiIsAErzB0HWQ}
    wecom-api-base-url: https://qyapi.weixin.qq.com
  # RBAC -> 企业微信/钉钉 出站推送（通讯录反向同步）
  outbound:
    enabled: ${IDP_OUTBOUND_ENABLED:true}
    # 目标提供方，多个用逗号分隔：wecom,dingtalk,mock
    providers: ${IDP_OUTBOUND_PROVIDERS:wecom}
    max-retries: ${IDP_OUTBOUND_MAX_RETRIES:5}
    process-interval-ms: ${IDP_OUTBOUND_PROCESS_INTERVAL_MS:5000}
    # 本地根部门ID：映射到企业微信/钉钉根部门 1，不重复创建
    root-dept-id: ${IDP_OUTBOUND_ROOT_DEPT_ID:1}
    # 非企业微信/钉钉来源使用的企业ID
    corp-id: ${IDP_OUTBOUND_CORP_ID:mock-corp}
    dingtalk-corp-id: ${IDP_OUTBOUND_DINGTALK_CORP_ID:ding-corp}
    # 企业微信：开启通讯录管理权限的应用
    wecom-corp-id: ${WECOM_CORP_ID:wwf3f175aaf3dcd969}
    wecom-secret: ${WECOM_SECRET:zbGgZmhrreKu_ZtPQCkidiVaaJdTwuyiIsAErzB0HWQ}
    wecom-api-base-url: ${WECOM_API_BASE_URL:https://qyapi.weixin.qq.com}
    # 钉钉：企业内部应用 AppKey/AppSecret
    dingtalk-app-key: ${DINGTALK_APP_KEY:}
    dingtalk-app-secret: ${DINGTALK_APP_SECRET:}
    dingtalk-api-base-url: ${DINGTALK_API_BASE_URL:https://oapi.dingtalk.com}

logging:
  level:
    com.example.rbac: debug
    org.springframework.security: info
