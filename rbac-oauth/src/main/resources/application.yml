server:
  port: 7071
  servlet:
    session:
      cookie:
        # Spring Session（HTTP 会话）的 Cookie 属性：与自建的两个 Cookie 保持一致
        http-only: true
        same-site: lax
        # 生产环境走 HTTPS 时通过 RBAC_COOKIE_SECURE=true 打开
        secure: ${RBAC_COOKIE_SECURE:false}

spring:
  application:
    name: rbac-oauth
  # 【必须与 rbac-backend 一致】两服务共享同一个库：
  # clientdetails 是本服务的客户端配置表，sys_user 是密码模式/授权码模式校验用户身份的数据源。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rbac?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # 共享 Redis：SSO 会话（sso:session:{username}）是本服务判定的登录态，
  # rbac-backend 与各子系统每个请求都靠 check_token 回到这里确认；删会话即全体下线。
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # 【登录态不走 HTTP 会话，也不使用 Spring Session】
  # 授权码/隐式模式的登录态由 OauthAuthStore 直接写 Redis 的 oauth2:auth:{token}
  # （精简 JSON，只含 userId / username / nickname / loginTime），浏览器侧只存一个 HttpOnly Cookie。
  # 这样 Redis 里是能看懂的认证信息，而不是序列化后的整团 SecurityContext。

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.oauth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 访问令牌的携带方式：第三方调 /openapi/** 时用 Authorization: Bearer <令牌>。
# 本服务不解析后台的登录令牌（客户端管理已移回 rbac-backend），因此没有 jwt.secret。
jwt:
  header: Authorization
  token-prefix: "Bearer "

# OAuth2 客户端密钥的加解密配置
# 库里 clientdetails.appSecret 存的是 AES 密文（由 rbac-backend 的「客户端管理」写入），
# 本服务要用同一把密钥解密它，才能校验客户端身份。
# 【必须与 rbac-backend 一致】两服务的该配置不一致时，解密失败，所有客户端都会认证失败。
# 【重要】此值一旦变更，库中已有的客户端密钥将无法解密，需要在「客户端管理」页面重新设置密钥。
oauth2:
  client-secret-key: rbac-client-secret-key-please-change-in-production-0123456789
  # 授权码在 Redis 中的存活时间（秒）。授权码是一次性的，兑换时原子取出并删除；
  # TTL 只是兜底，避免用户放弃授权后键一直留着。
  authorization-code-ttl-seconds: 300
  # 授权码/隐式模式的登录页地址。授权端点发现未登录时会 302 到这里。
  # 页面由 rbac-oauth-web（独立前端工程，开发环境 5174）提供，因此默认给绝对地址 ——
  # 用户从授权服务源（7071）发起授权时，相对路径 /login 会被解析到授权服务自己身上（那里没有页面）。
  # 若前端与授权服务同源部署（生产环境 Nginx 统一入口），配成 /login 这类相对路径也可以。
  login-page-url: http://localhost:5174/login
  # 授权（确认）页地址，规则同上。未配 autoApproveScopes 的客户端，
  # 用户在授权端点会先被带到这个页面确认。
  approval-page-url: http://localhost:5174/approve
  # 授权码回调的联调端点（GET /oauth/test-callback）
  test-callback:
    # 仅测试用：该端点无需登录即可访问，并且会把换到的令牌直接返回给调用方。
    # 生产环境请置为 false —— 关闭后该端点不会被注册。
    enabled: true
    # 换令牌用的客户端，必须与发起授权时的 client_id 一致（这里对应示例客户端与它的明文密钥）
    client-id: rbac-third-party
    client-secret: client123
  # 令牌签名密钥对（jwt.jks）。令牌自包含，第三方可直接用 /oauth/token_key 暴露的公钥验签。
  # 多实例部署时各实例需使用同一份 keystore，否则跨实例验签会失败。
  jwt:
    keyPairName: jwt.jks
    keyPairAlias: jwt
    keyPairSecret: 123123
    keyPairStoreSecret: 123123
# RocketMQ：本服务只做**消费端** —— 接收 rbac-backend 的「强制下线」通知，
# 删掉该用户的 Redis 会话，使他在所有子系统的令牌立刻失效。
# 【必须与 rbac-backend 的 rbac.sso.kick-topic 一致】
rocketmq:
  name-server: localhost:9876
  producer:
    # 本服务不主动发消息；starter 仍会创建生产者，给个独立的组名避免与其他服务混淆
    group: rbac-oauth-producer

# SSO 会话管理
rbac:
  # 浏览器 Cookie 的 Secure 属性：生产环境走 HTTPS 时通过 RBAC_COOKIE_SECURE=true 打开。
  # 覆盖 RBAC_OAUTH2_AUTH / RBAC_OAUTH2_REQ / Spring Session 三个 Cookie。
  cookie:
    secure: ${RBAC_COOKIE_SECURE:false}
  # 允许的前端源（逗号分隔）：CORS 与非 GET 请求的 Origin 校验共用这份清单。
  # 生产环境改成实际域名，或用环境变量 CORS_ALLOWED_ORIGINS 覆盖。
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5177}
  sso:
    # 强制下线的 topic（生产端在 rbac-backend 的 SsoSessionService）
    kick-topic: RBAC_OAUTH_SESSION
    # 消费组名，要与其他消费者区分开
    kick-consumer-group: rbac-oauth-session-consumer
    # 库里 sso 会话「在线」记录与 Redis 实际会话的对齐周期（毫秒）
    reconcile-interval-ms: 60000
    # 会话空闲超时（秒）：每次刷新令牌（touch）续期，不用就自然过期
    session-idle-ttl-seconds: ${SSO_SESSION_IDLE_TTL:604800}
    # 会话绝对上限（秒）：从登录时刻算起，永不延长，防止「一直用就永不重登」
    session-max-ttl-seconds: ${SSO_SESSION_MAX_TTL:2592000}
    # 刷新令牌「已用」墓碑的保留秒数：对齐 clientdetails.refresh_token_validity（7 天），
    # 保证刷新令牌整个有效期内被重放都能识别为复用并撤销会话
    refresh-reuse-ttl-seconds: ${SSO_REFRESH_REUSE_TTL:604800}
  # 客户端配置缓存（clientdetails）
  client:
    # 客户端变更的 topic：rbac-backend 生产，本服务消费后删 oauth2:client:{clientId}
    change-topic: RBAC_CLIENT_CHANGE
    change-consumer-group: rbac-oauth-client-consumer
    # 缓存 TTL（秒）。正常失效靠 MQ，这里只是兜底，避免消息丢失时缓存永远陈旧
    cache-ttl-seconds: 3600
  # 会话撤销广播：子系统本地验签看不到会话是否存活，销毁会话时由本服务把作废的 sid 推给它们
  # 【必须与各子系统的 rbac.session.revoke-topic 一致】
  session:
    revoke-topic: RBAC_SESSION_REVOKE
    # 撤销记录兜底保留秒数：只有在无法从 clientdetails 读到客户端有效期时才使用；
    # 正常按会话涉及客户端的 access_token_validity 最大值计算后随消息下发
    revoke-default-ttl-seconds: 43200

# 企业微信扫码登录（MVP）
# enabled 置为 true 并填好 CorpID / AgentId / Secret / Callback 后，登录页会出现「企业微信扫码登录」。
# 生产环境请通过环境变量或密钥管理服务注入 secret（也支持 ENC(...) 密文）。
wecom:
  enabled: ${WECOM_ENABLED:true}
  corp-id: ${WECOM_CORP_ID:wwf3f175aaf3dcd969}
  agent-id: ${WECOM_AGENT_ID:1000002}
  secret: ${WECOM_SECRET:qnVA39jdFS69ZnDWSvIaqKCKRXS_zUD_lt4-xoHxCnY}
  # 必须与企业微信后台登记的回调地址完全一致，且公网可达
  callback-url: ${WECOM_CALLBACK_URL:http://102sp3174to00.vicp.fun/oauth/wecom/callback}
  qr-connect-url: https://open.work.weixin.qq.com/wwopen/sso/qrConnect
  api-base-url: https://qyapi.weixin.qq.com
  # 扫码登录：二维码内容为本服务短链，票据写入 MySQL + Redis
  qr:
    enabled: ${WECOM_QR_ENABLED:true}
    # 二维码/短链有效期（秒）
    ttl-seconds: ${WECOM_QR_TTL_SECONDS:300}
    # 手机确认后，电脑端完成登录的等待时间（秒）
    confirm-ttl-seconds: ${WECOM_QR_CONFIRM_TTL_SECONDS:120}
    # 短链对外基地址：必须是手机能访问的地址，通常与回调地址同域
    public-base-url: ${WECOM_QR_PUBLIC_BASE_URL:http://102sp3174to00.vicp.fun}
    short-path: ${WECOM_QR_SHORT_PATH:/q}

# 多 IdP 登录策略
idp:
  # 外部身份未绑定时，允许用户输入本地账号密码自助绑定
  self-bind-enabled: ${IDP_SELF_BIND_ENABLED:true}
  # rbac-oauth-web 的自助绑定页
  bind-page-url: ${IDP_BIND_PAGE_URL:http://localhost:5174/bind}
  # mock 身份提供方，仅开发/测试使用；生产必须保持 false
  mock-enabled: ${IDP_MOCK_ENABLED:false}
  mock:
    provider: mock
    corp-id: mock-corp
    external-user-id: ${IDP_MOCK_USER_ID:mock-user-001}
    display-name: Mock User
    mobile: "13800000000"
    email: mock@example.com
    department-ids: "10"
  # JIT 自动建号；默认关闭，启用前请确认外部通讯录可信
  jit:
    enabled: ${IDP_JIT_ENABLED:false}
    default-dept-id: ${IDP_JIT_DEPT_ID:1}
    default-role-keys: ${IDP_JIT_ROLE_KEYS:common}
    username-prefix: ${IDP_JIT_USERNAME_PREFIX:idp_}

logging:
  level:
    com.example.oauth: debug
    org.springframework.security: info
