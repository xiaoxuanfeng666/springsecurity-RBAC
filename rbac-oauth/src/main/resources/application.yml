server:
  port: 7071

spring:
  application:
    name: rbac-oauth
  # 【必须与 rbac-backend 一致】两服务共享同一个库：
  # clientdetails 是本服务的客户端配置表，sys_user 是密码模式/授权码模式校验用户身份的数据源。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rbac?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # 【必须与 rbac-backend 一致】共享 Redis：管理端登录态（login:session:*）由那边写入、这边校验，
  # 因此停用/离职删除会话后，本服务持有的令牌也会立即失效。
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # 【登录态不走 HTTP 会话，也不使用 Spring Session】
  # 授权码/隐式模式的登录态由 OauthAuthStore 直接写 Redis 的 oauth2:auth:{token}
  # （精简 JSON，只含 userId / username / nickname / loginTime），浏览器侧只存一个 HttpOnly Cookie。
  # 这样 Redis 里是能看懂的认证信息，而不是序列化后的整团 SecurityContext。

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.oauth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 访问令牌的携带方式：第三方调 /openapi/** 时用 Authorization: Bearer <令牌>。
# 本服务不解析后台的登录令牌（客户端管理已移回 rbac-backend），因此没有 jwt.secret。
jwt:
  header: Authorization
  token-prefix: "Bearer "

# OAuth2 客户端密钥的加解密配置
# 库里 clientdetails.appSecret 存的是 AES 密文（由 rbac-backend 的「客户端管理」写入），
# 本服务要用同一把密钥解密它，才能校验客户端身份。
# 【必须与 rbac-backend 一致】两服务的该配置不一致时，解密失败，所有客户端都会认证失败。
# 【重要】此值一旦变更，库中已有的客户端密钥将无法解密，需要在「客户端管理」页面重新设置密钥。
oauth2:
  client-secret-key: rbac-client-secret-key-please-change-in-production-0123456789
  # 授权码在 Redis 中的存活时间（秒）。授权码是一次性的，兑换时原子取出并删除；
  # TTL 只是兜底，避免用户放弃授权后键一直留着。
  authorization-code-ttl-seconds: 300
  # 授权码/隐式模式的登录页地址。授权端点发现未登录时会 302 到这里。
  # 页面由 rbac-oauth-web（独立前端工程，开发环境 5174）提供，因此默认给绝对地址 ——
  # 用户从授权服务源（7071）发起授权时，相对路径 /login 会被解析到授权服务自己身上（那里没有页面）。
  # 若前端与授权服务同源部署（生产环境 Nginx 统一入口），配成 /login 这类相对路径也可以。
  login-page-url: http://localhost:5174/login
  # 授权（确认）页地址，规则同上。未配 autoApproveScopes 的客户端，
  # 用户在授权端点会先被带到这个页面确认。
  approval-page-url: http://localhost:5174/approve
  # 授权码回调的联调端点（GET /oauth/test-callback）
  test-callback:
    # 仅测试用：该端点无需登录即可访问，并且会把换到的令牌直接返回给调用方。
    # 生产环境请置为 false —— 关闭后该端点不会被注册。
    enabled: true
    # 换令牌用的客户端，必须与发起授权时的 client_id 一致（这里对应示例客户端与它的明文密钥）
    client-id: rbac-third-party
    client-secret: client123
  # 令牌签名密钥对（jwt.jks）。令牌自包含，第三方可直接用 /oauth/token_key 暴露的公钥验签。
  # 多实例部署时各实例需使用同一份 keystore，否则跨实例验签会失败。
  jwt:
    keyPairName: jwt.jks
    keyPairAlias: jwt
    keyPairSecret: 123123
    keyPairStoreSecret: 123123
# RocketMQ：本服务只做**消费端** —— 接收 rbac-backend 的「强制下线」通知，
# 删掉该用户的 Redis 会话，使他在所有子系统的令牌立刻失效。
# 【必须与 rbac-backend 的 rbac.sso.kick-topic 一致】
rocketmq:
  name-server: localhost:9876
  producer:
    # 本服务不主动发消息；starter 仍会创建生产者，给个独立的组名避免与其他服务混淆
    group: rbac-oauth-producer

# SSO 会话管理
rbac:
  sso:
    # 强制下线的 topic（生产端在 rbac-backend 的 SsoSessionService）
    kick-topic: RBAC_OAUTH_SESSION
    # 消费组名，要与其他消费者区分开
    kick-consumer-group: rbac-oauth-session-consumer
    # 库里 sso 会话「在线」记录与 Redis 实际会话的对齐周期（毫秒）
    reconcile-interval-ms: 60000

# 企业微信扫码登录（MVP）
# enabled 置为 true 并填好 CorpID / AgentId / Secret / Callback 后，登录页会出现「企业微信扫码登录」。
# 生产环境请通过环境变量或密钥管理服务注入 secret（也支持 ENC(...) 密文）。
wecom:
  enabled: ${WECOM_ENABLED:false}
  corp-id: ${WECOM_CORP_ID:}
  agent-id: ${WECOM_AGENT_ID:}
  secret: ${WECOM_SECRET:}
  # 必须与企业微信后台登记的回调地址完全一致，且公网可达
  callback-url: ${WECOM_CALLBACK_URL:http://localhost:7071/oauth/wecom/callback}
  qr-connect-url: https://open.work.weixin.qq.com/wwopen/sso/qrConnect
  api-base-url: https://qyapi.weixin.qq.com

# 多 IdP 登录策略
idp:
  # 外部身份未绑定时，允许用户输入本地账号密码自助绑定
  self-bind-enabled: ${IDP_SELF_BIND_ENABLED:true}
  # rbac-oauth-web 的自助绑定页
  bind-page-url: ${IDP_BIND_PAGE_URL:http://localhost:5174/bind}
  # mock 身份提供方，仅开发/测试使用；生产必须保持 false
  mock-enabled: ${IDP_MOCK_ENABLED:false}
  mock:
    provider: mock
    corp-id: mock-corp
    external-user-id: ${IDP_MOCK_USER_ID:mock-user-001}
    display-name: Mock User
    mobile: "13800000000"
    email: mock@example.com
    department-ids: "10"
  # JIT 自动建号；默认关闭，启用前请确认外部通讯录可信
  jit:
    enabled: ${IDP_JIT_ENABLED:false}
    default-dept-id: ${IDP_JIT_DEPT_ID:1}
    default-role-keys: ${IDP_JIT_ROLE_KEYS:common}
    username-prefix: ${IDP_JIT_USERNAME_PREFIX:idp_}

logging:
  level:
    com.example.oauth: debug
    org.springframework.security: info
