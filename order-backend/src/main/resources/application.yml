server:
  port: 7073

spring:
  application:
    name: order-backend
  # 订单中心自己的独立库 order_center，与 RBAC 库（rbac）、营销库（marketing）都没有任何关联
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/order_center?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    # 注意：这里没有 spring.jackson.date-format —— 它只作用于 java.util.Date，
    # 对 LocalDateTime 无效。实体里的时间字段统一由 JacksonConfig 按 yyyy-MM-dd HH:mm:ss 处理。
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.example.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 本系统没有用户体系，登录授权全部交给 rbac-oauth（授权服务器，端口 7071）：
#   密码模式   -> 后端带客户端凭证调 /oauth/token（grant_type=password）
#   授权码模式 -> 前端跳 /oauth/authorize，回调后由后端调 /oauth/token（grant_type=authorization_code）
#   请求鉴权   -> 取 Bearer 令牌调 /oauth/check_token 换回用户名
# client-id / client-secret 必须与 RBAC 库 clientdetails 里的 order-center 客户端一致。
oauth2:
  # 后端到后端调用用（换令牌、check_token）
  server-url: http://localhost:7071
  # 浏览器跳转到授权端点用的地址：走授权前端（5174）的 /oauth 代理，与登录页同源。
  # 分工的原因见 OAuth2ClientProperties#browserAuthorizeBaseUrl。
  browser-authorize-base-url: http://localhost:5174
  client-id: order-center
  client-secret: order123
  # 授权码模式的回调地址，必须与 clientdetails.redirectUrl 里登记的一模一样，否则换令牌会被拒
  redirect-uri: http://localhost:5176/oauth/callback
  # 申请的授权范围。
  # 【注意】令牌端点的 scope 参数按 RFC 6749 是**空格**分隔的（授权服务用 StringTokenizer(scope, " ") 解析），
  # 所以这里不能写成 "read,write" —— 那会被当成一个名叫 "read,write" 的范围而报 invalid_scope。
  # 本系统不按 scope 判权（用的是 RBAC 下发的权限点），所以申请单个 read 即可。
  scope: read

# RocketMQ：消费 RBAC 下发的子系统数据（topic RBAC_SUBSYSTEM_SYNC，tag 为本子系统编码 order-center）
# 需要先启动 RocketMQ（NameServer 默认 9876）。broker 未启动时收不到数据，
# 此时用户无法登录本系统（权限数据来源于 RBAC），这是预期行为。
rocketmq:
  name-server: localhost:9876
