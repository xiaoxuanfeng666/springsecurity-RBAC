server:
  port: 7073

spring:
  application:
    name: order-backend
  # 订单中心自己的独立库 order_center，与 RBAC 库（rbac）、营销库（marketing）都没有任何关联
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/order_center?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # 只用于授权流程 state 的一次性缓存（防重放）；业务数据仍只在自己的 MySQL
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 5000ms
  jackson:
    # 注意：这里没有 spring.jackson.date-format —— 它只作用于 java.util.Date，
    # 对 LocalDateTime 无效。实体里的时间字段统一由 JacksonConfig 按 yyyy-MM-dd HH:mm:ss 处理。
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.example.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 本系统没有用户体系，登录授权全部交给 rbac-oauth（授权服务器，端口 7071）：
#   密码模式   -> 后端带客户端凭证调 /oauth/token（grant_type=password）
#   授权码模式 -> 前端跳 /oauth/authorize，回调后由后端调 /oauth/token（grant_type=authorization_code）
#   请求鉴权   -> 本地用 /oauth/token_key 的公钥验签 JWT，不再每请求回调 /oauth/check_token
# client-id / client-secret 必须与 RBAC 库 clientdetails 里的 order-center 客户端一致。
oauth2:
  # 后端到后端调用用（换令牌、启动时拉取验签公钥）
  server-url: http://localhost:7071
  # 浏览器跳转到授权端点用的地址：走授权前端（5174）的 /oauth 代理，与登录页同源。
  # 分工的原因见 OAuth2ClientProperties#browserAuthorizeBaseUrl。
  browser-authorize-base-url: http://localhost:5174
  client-id: order-center
  client-secret: order123
  # 授权码模式的回调地址，必须与 clientdetails.redirectUrl 里登记的一模一样，否则换令牌会被拒
  redirect-uri: http://localhost:5176/oauth/callback
  # 申请的授权范围。
  # 【注意】令牌端点的 scope 参数按 RFC 6749 是**空格**分隔的（授权服务用 StringTokenizer(scope, " ") 解析），
  # 所以这里不能写成 "read,write" —— 那会被当成一个名叫 "read,write" 的范围而报 invalid_scope。
  # 本系统不按 scope 判权（用的是 RBAC 下发的权限点），所以申请单个 read 即可。
  scope: read

# RocketMQ：
#   消费 RBAC 下发的子系统数据（topic RBAC_SUBSYSTEM_SYNC，tag 为本子系统编码 order-center）
#   上报增删改审计日志（topic RBAC_AUDIT_LOG）
# producer.group 必须配置，否则 starter 不创建 RocketMQTemplate，审计上报会被跳过。
# 需要先启动 RocketMQ（NameServer 默认 9876）。broker 未启动时收不到数据，
# 此时用户无法登录本系统（权限数据来源于 RBAC），这是预期行为。
rocketmq:
  name-server: localhost:9876
  producer:
    group: order-backend-producer
    send-message-timeout: 3000

rbac:
  # 允许的前端源（逗号分隔）：CORS 与非 GET 请求的 Origin 校验共用这份清单。
  # 生产环境改成实际域名，或用环境变量 CORS_ALLOWED_ORIGINS 覆盖。
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5176}
  session:
    # 消费 rbac-oauth 广播的「会话已撤销」：本地验签看不到会话是否存活，靠这条消息拒掉已登出/被踢的令牌
    # 【必须与 rbac-oauth 的 rbac.session.revoke-topic 一致】
    revoke-topic: RBAC_SESSION_REVOKE
    # 撤销记录兜底保留秒数：仅在消息未带 TTL 时使用。正常由 rbac-oauth 按客户端
    # access_token_validity 计算后随消息下发，令牌有效期改长时不需要改这里
    revoke-ttl-seconds: 43200
  # 登录用户/权限缓存（Redis）的有效期（秒）：正常失效靠 RBAC 同步消息清空，这里只是兜底
  auth-cache-ttl-seconds: 300
  # BFF：浏览器只持一个 HttpOnly 会话 Cookie，OAuth 令牌全部存在本服务 Redis
  bff:
    # Cookie 名按系统区分，多个子系统部署在同一域名下时互不覆盖
    cookie-name: order_bff_session
    # 生产环境走 HTTPS 时置为 true（开发环境是 http，加了浏览器会丢弃 Cookie）
    cookie-secure: false
    # 空闲有效期：会话在这段时间内没有续期就过期
    session-idle-ttl-seconds: 1800
    # 绝对有效期：从登录时刻算起，到点必须重新授权
    session-max-ttl-seconds: 43200

